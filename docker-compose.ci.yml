services:
  ci:
    image: ${VENTWISE_TEST_IMAGE:-ventwise-test:local}
    build:
      context: .
      dockerfile: Dockerfile.ci
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspace:ro
      - ${VENTWISE_TEST_ARTIFACTS:-./.test-artifacts}:/artifacts
