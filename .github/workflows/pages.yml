name: Publish documentation to GitHub Pages

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate canonical decision-model Markdown
        shell: python
        run: |
          from pathlib import Path
          source = Path("docs/decision-model/decision-engine.md")
          if not source.is_file() or not source.read_text(encoding="utf-8").strip():
              raise SystemExit(f"Missing or empty canonical source: {source}")
          text = source.read_text(encoding="utf-8")
          required = (
              "# VentWise decision-engine contract",
              "```mermaid",
              "## Pipeline and precedence",
              "## Formulas and derived signals",
              "## Scenario matrix",
              "## Missing, stale, invalid, and awaiting data",
              "## Forecast safety",
              "## Result, trace, reason, confidence, and data quality",
              "## Limits and maintenance rule",
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f"Canonical source is missing sections: {missing}")
          print(f"Validated canonical Markdown source: {source}")

  deploy:
    name: Build and publish documentation
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
