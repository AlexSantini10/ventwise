name: CI
# CI is the release gate for experimental builds.
run-name: CI on ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/experimental-release.yml"
      - ".github/workflows/release.yml"
      - "custom_components/**"
      - "src/**"
      - "tests/**"
      - "scripts/build_release_package.py"
      - "scripts/ha-local-docker-test.py"
      - "scripts/test-ci-docker.ps1"
      - "scripts/run_tests.py"
      - "scripts/run_test_suite.py"
      - ".githooks/**"
      - "Dockerfile.ci"
      - "docker-compose.ci.yml"
      - "pyproject.toml"
      - "requirements-ci.txt"
      - "requirements-test.txt"
      - "requirements-dev.txt"
      - "hacs.json"
      - "README.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/experimental-release.yml"
      - ".github/workflows/release.yml"
      - "custom_components/**"
      - "src/**"
      - "tests/**"
      - "scripts/build_release_package.py"
      - "scripts/ha-local-docker-test.py"
      - "scripts/test-ci-docker.ps1"
      - "scripts/run_tests.py"
      - "scripts/run_test_suite.py"
      - ".githooks/**"
      - "Dockerfile.ci"
      - "docker-compose.ci.yml"
      - "pyproject.toml"
      - "requirements-ci.txt"
      - "requirements-test.txt"
      - "requirements-dev.txt"
      - "hacs.json"
      - "README.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  automated-tests:
    name: automated-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up runner Python
        uses: actions/setup-python@v5
        with:
          # The host Python only launches the Docker-backed canonical runner.
          # Keep the exact test runtime pinned in Dockerfile.ci instead of
          # requiring that patch release on every ubuntu-latest image.
          python-version: "3.14"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build cached test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          tags: ventwise-ci:latest
          load: true
          cache-from: type=gha,scope=ventwise-test
          cache-to: type=gha,mode=max,scope=ventwise-test
      - name: Run the canonical local/CI test workflow
        env:
          VENTWISE_TEST_IMAGE: ventwise-ci:latest
          VENTWISE_TEST_SKIP_BUILD: "1"
        run: python scripts/run_tests.py

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-artifacts
          path: .test-artifacts
          if-no-files-found: ignore

  decision-model-docs:
    name: decision-model-docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify decision-model documentation
        run: |
          test -s docs/decision-model/decision-model-report.html
          test -s docs/index.html
          test -s docs/decision-model/decision-model-explainability.md
          test -s docs/decision-model/index.html
          test -s docs/decision-model/overview.html
          test -s docs/decision-model/inputs.html
          test -s docs/decision-model/scenarios.html
          test -s docs/decision-model/operations.html
          test -s docs/decision-model/site.css
          grep -q "Exhaustive data inventory" docs/decision-model/decision-model-report.html
          grep -q "Scenario registry" docs/decision-model/decision-model-report.html
          grep -q "Propose an unlisted scenario" docs/decision-model/decision-model-report.html
          grep -q "New scenario proposal template" docs/decision-model/decision-model-explainability.md

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: hacs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate with HACS
        uses: "hacs/action@main"
        with:
          category: integration
