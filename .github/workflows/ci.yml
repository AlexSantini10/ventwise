name: CI
# CI is the release gate for experimental builds.
run-name: CI on ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches:
      - dev
      - main
      - test
      - "test/**"
      - "test-*"
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/experimental-release.yml"
      - ".github/workflows/release.yml"
      - "custom_components/**"
      - "src/**"
      - "tests/**"
      - "scripts/build_release_package.py"
      - "scripts/ha-local-docker-test.py"
      - "pyproject.toml"
      - "requirements-ci.txt"
      - "requirements-dev.txt"
      - "hacs.json"
      - "README.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/experimental-release.yml"
      - ".github/workflows/release.yml"
      - "custom_components/**"
      - "src/**"
      - "tests/**"
      - "scripts/build_release_package.py"
      - "scripts/ha-local-docker-test.py"
      - "pyproject.toml"
      - "requirements-ci.txt"
      - "requirements-dev.txt"
      - "hacs.json"
      - "README.md"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  home-assistant:
    name: home-assistant
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Install Home Assistant 2026.7.2
        run: python -m pip install --upgrade -r requirements-ci.txt

      - name: Run Home Assistant integration tests on 2026.7.2
        run: python -m pytest tests/integration tests/system -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    needs: home-assistant
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: hacs
    runs-on: ubuntu-latest
    needs: home-assistant
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate with HACS
        uses: "hacs/action@main"
        with:
          category: integration
